name: DuckDuckOps build

# Builds the Windows x64 app on a GitHub-hosted runner (it has the C++ build
# tools the native modules need), launches it once with a fresh profile and
# uploads the app as a zip plus a screenshot, the activity bar entries,
# renderer errors and logs. A pushed version tag (ddo-0.1.1) also publishes a
# GitHub Release of that name with the app, if the build and the layout checks pass.

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
    tags:
      - 'ddo-[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VSCODE_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: pwsh
        run: |
          . build/azure-pipelines/win32/exec.ps1
          $ErrorActionPreference = "Stop"

          # Run preinstall script before root dependencies are installed
          # so that Electron/v8 headers are patched correctly for native modules.
          exec { node build/npm/preinstall.ts }

          for ($i = 1; $i -le 3; $i++) {
            try {
              exec { npm ci }
              break
            }
            catch {
              if ($i -eq 3) {
                Write-Error "npm ci failed after 3 attempts"
                throw
              }
              Write-Host "npm ci failed attempt $i, retrying..."
              Start-Sleep -Seconds 2
            }
          }
        env:
          npm_config_arch: x64
          npm_config_foreground_scripts: "true"
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Put signtool on PATH
        shell: pwsh
        run: |
          # Packaging strips Authenticode signatures with signtool.exe from the Windows SDK,
          # which the runner has installed but not on PATH
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found in the Windows SDK"
          }
          Write-Host "Using $($signtool.FullName)"
          $signtool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Package DuckDuckOps
        shell: pwsh
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Launch and take a screenshot
        shell: pwsh
        run: node build/ddo/smoke.ts ..\VSCode-win32-x64 .build\ddo-smoke

      - name: Zip the app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Compress-Archive -Path ..\VSCode-win32-x64\* -DestinationPath .build\DuckDuckOps-win32-x64.zip

      - name: Upload the app
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DuckDuckOps-win32-x64
          path: .build/DuckDuckOps-win32-x64.zip
          if-no-files-found: ignore

      - name: Upload screenshot and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddo-smoke
          path: .build/ddo-smoke
          if-no-files-found: ignore

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/ddo-') }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DuckDuckOps-win32-x64

      - name: Create the release
        run: |
          zip="DuckDuckOps-Terminal-win32-x64-${GITHUB_REF_NAME#ddo-}.zip"
          mv DuckDuckOps-win32-x64.zip "$zip"
          gh release create "$GITHUB_REF_NAME" "$zip" --generate-notes --title "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
